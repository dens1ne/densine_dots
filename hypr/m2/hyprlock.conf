source = $HOME/.config/hypr/accents/macchiato.conf
source = $HOME/.config/hypr/wallpaper.conf
$accent = $mauve
$accentAlpha = $mauveAlpha
$font = JetBrainsMono Nerd Font

# GENERAL
general {
    disable_loading_bar = true
    hide_cursor = true
}

# BACKGROUND
background {
    monitor =
    path = /home/densine/.config/background/wall2.png
    # path = cmd[] swww query | grep -oP '(?<=: image: ).*' | uniq
    blur_passes = 2
    color = rgba(24273aaa)

}

# TIME
label {
    monitor =
    text = cmd[update:30000] echo "$(date +"%R")"
    color = $text
    font_size = 90
    font_family = $font
    position = -30, 0
    halign = right
    valign = top
}

# DATE
label {
    monitor =
    text = cmd[update:43200000] echo "$(date +"%A, %d %B %Y")"
    color = $text
    font_size = 25
    font_family = $font
    position = -30, -150
    halign = right
    valign = top
}

# USER AVATAR

image {
    monitor =
    path = ~/.face/face1.png
    size = 100
    border_color = $accent

    position = 0, 75
    halign = center
    valign = center
}

