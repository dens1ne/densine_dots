[window]
opacity = 0.7
blur = true

decorations = "Full"
decorations_theme_variant = "Dark"

[terminal.shell]
program = "/bin/fish"
# args = ["-l", "-C", "zellij"]
args = ["-l"]

[font]
# normal = { family = "Hack Nerd Font Mono", style = "Regular" }
# bold = { family = "Hack Nerd Font Mono", style = "Bold" }
# italic = { family = "Hack Nerd Font Mono", style = "Italic" }
normal = { family = "JetBrainsMono Nerd Font Mono", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font Mono", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font Mono", style = "Italic" }

size = 10

[colors.primary]
foreground = "#ffffff"
#background = "#192a30"
background = "#090e30"
#background = "#08082C"

[colors]
cursor = { text = "#776fa4", cursor = "#776fa4" }
vi_mode_cursor = { text = "#776fa4", cursor = "#776fa4" }

[cursor]
style = { shape = "Beam", blinking = "On" }
thickness = 0.3

[keyboard]
bindings = [
{ key = "Equals", mods = "Control", action = "None" },
{ key = "-", mods = "Control", action = "None" },
]

